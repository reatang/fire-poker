version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

vars:
  APP_NAME: "fire-poker"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - uv run tools/release.py package {{if .TARGET}}--target {{.TARGET}}{{end}} {{if .FORMATS}}--formats {{.FORMATS}}{{end}}

  package:doctor:
    summary: Checks native desktop packaging dependencies
    cmds:
      - uv run tools/release.py doctor {{if .TARGET}}--target {{.TARGET}}{{end}} {{if .FORMATS}}--formats {{.FORMATS}}{{end}}

  package:sync:
    summary: Synchronizes release metadata from build/release.json
    cmds:
      - uv run tools/release.py sync

  check:
    summary: Runs the same frontend and backend checks as CI (assumes frontend dependencies are installed)
    cmds:
      - task: check:frontend
      - task: check:backend

  check:frontend:
    summary: Runs frontend tests and the production build, which also type-checks and produces frontend/dist
    dir: frontend
    cmds:
      - npx vitest run
      - npm run build

  check:backend:
    summary: Runs Go tests and vet for every package; main.go embeds frontend/dist, so run check:frontend first
    cmds:
      - go test ./...
      - go vet ./...

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
